[constraints]
max_cycles = 0
max_cc = 25
max_fn_lines = 100
no_god_files = true

[[layers]]
name = "rules"
paths = ["internal/game/*", "internal/sgf/*"]
order = 0

[[layers]]
name = "engine"
paths = ["internal/nn/*", "internal/mcts/*"]
order = 1

[[layers]]
name = "apps"
paths = ["internal/selfplay/*", "internal/arena/*", "internal/gtp/*", "cmd/gofer/*"]
order = 2

[[layers]]
name = "training"
paths = ["training/*"]
order = 3

[[boundaries]]
from = "internal/game/*"
to = "internal/nn/*"
reason = "Rules must not depend on the network"
