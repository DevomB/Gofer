name: Pipeline smoke

# End-to-end check of the training pipeline on a free runner: Go shard writer,
# orchestrator + learner unit tests, a real 2-cycle run (self-play -> train ->
# export -> SPRT gate -> publish), and the training image build.
on:
  push:
    paths: ["cmd/**", "training/**", "configs/**", "infra/**", ".github/workflows/pipeline-smoke.yml"]
  pull_request:
    paths: ["cmd/**", "training/**", "configs/**", "infra/**", ".github/workflows/pipeline-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install learner (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r training/requirements.txt pytest
      - name: Go shard writer tests
        run: go test ./cmd/gofer/ -count=1 -run 'Shard|NPY|PolicyNext'
      - name: Orchestrator + learner tests
        run: pytest training -q
      - name: 2-cycle pipeline run
        run: python -m training.pipeline run --config configs/pipeline-smoke.toml --cycles 2
      - name: Report
        if: always()
        run: |
          python -m training.pipeline status --config configs/pipeline-smoke.toml || true
          python -m training.pipeline estimate --config configs/pipeline-smoke.toml --cycles 100 || true
          python -m training.pipeline report --config configs/pipeline-smoke.toml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-smoke-run
          path: |
            runs/smoke/report.html
            runs/smoke/state.json
            runs/smoke/history/
            runs/smoke/gating/
            runs/smoke/logs/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU training image (validates the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          build-args: |
            BASE=python:3.11-slim
            TORCH_INDEX=https://download.pytorch.org/whl/cpu
          tags: gofer-train:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image self-check
        run: docker run --rm --entrypoint python gofer-train:cpu -m pytest training/pipeline -q
