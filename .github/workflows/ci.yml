name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - name: vet
        run: go vet ./...
      - name: install GNU Go (arena integration test)
        run: sudo apt-get install -y gnugo
      - name: test
        run: PATH=$PATH:/usr/games go test -count=1 ./...
      - name: race
        run: go test -race -short -count=1 ./...
      - name: pure-Go build
        run: CGO_ENABLED=0 go build -o bin/gofer ./cmd/gofer
      - name: WebAssembly engine (web/engine/gofer.wasm)
        run: GOOS=js GOARCH=wasm go vet ./cmd/gofer-wasm && GOOS=js GOARCH=wasm go build -o /tmp/gofer.wasm ./cmd/gofer-wasm

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r training/requirements.txt
      - name: pytest
        run: python -m pytest -q training

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get install -y gnugo
          scripts/install-ort.sh
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r training/requirements.txt
      - name: build with ONNX Runtime
        run: make build
      - name: one tiny training generation (self-play -> train -> export -> arena)
        run: |
          python -m training.loop --run /tmp/e2e --gofer bin/gofer --gens 1 \
            --set games_per_gen=12 --set full_visits=24 --set fast_visits=8 \
            --set eval_games=4 --set eval_visits=8 --set anchor_games=2 \
            --set 'anchors=["gnugo,level=1"]' --set window_min=500
          test -f /tmp/e2e/models/gen-0001.onnx
          cat /tmp/e2e/eval/ratings.json
      - name: GTP smoke
        run: printf 'boardsize 9\nclear_board\ngenmove b\nquit\n' | bin/gofer gtp -model /tmp/e2e/models/gen-0001.onnx -visits 16
