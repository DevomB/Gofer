name: Training image

# Publish the training image to GHCR (free for public repos) so a rented box
# only needs `docker run` (RunPod / Vast templates can point at it directly):
#   ghcr.io/<owner>/gofer-train:gpu   CUDA base, for GPU rentals
#   ghcr.io/<owner>/gofer-train:cpu   slim CPU base
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: gpu
            base: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
            torch_index: ""
          - variant: cpu
            base: python:3.11-slim
            torch_index: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gofer-train" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            TORCH_INDEX=${{ matrix.torch_index }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ matrix.variant }}
            ${{ steps.name.outputs.image }}:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
